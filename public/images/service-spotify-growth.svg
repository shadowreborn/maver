<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="spLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#1ed760"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#spBg)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1280" height="70" fill="#181a20"/>
  <line x1="0" y1="70" x2="1280" y2="70" stroke="#262933" stroke-width="1"/>
  <circle cx="80" cy="35" r="14" fill="#1DB954"/>
  <text x="105" y="42" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">
    SPOTIFY FOR ARTISTS — ALGORITHMIC CAMPAIGN REPORT
  </text>
  <rect x="1030" y="18" width="190" height="34" rx="4" fill="#15803d"/>
  <text x="1125" y="41" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">
    11× ALGORITHMIC UPLIFT
  </text>

  <!-- Metrics Grid -->
  <g transform="translate(60, 95)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="270" height="120" rx="8" fill="#181a22" stroke="#292c37" stroke-width="1"/>
      <text x="24" y="36" fill="#9ca3af" font-family="sans-serif" font-size="15" font-weight="700">DISCOVER WEEKLY STREAMS</text>
      <text x="24" y="80" fill="#1DB954" font-family="sans-serif" font-size="38" font-weight="700">11× <tspan font-size="18" fill="#9ca3af">LIFT</tspan></text>
      <text x="24" y="104" fill="#34d399" font-family="sans-serif" font-size="14">Velocity vs prior release</text>
    </g>

    <g transform="translate(295, 0)">
      <rect x="0" y="0" width="270" height="120" rx="8" fill="#181a22" stroke="#292c37" stroke-width="1"/>
      <text x="24" y="36" fill="#9ca3af" font-family="sans-serif" font-size="15" font-weight="700">ALGORITHMIC SHARE</text>
      <text x="24" y="80" fill="#38bdf8" font-family="sans-serif" font-size="38" font-weight="700">~45%</text>
      <text x="24" y="104" fill="#34d399" font-family="sans-serif" font-size="14">Of total streams in week 3</text>
    </g>

    <g transform="translate(590, 0)">
      <rect x="0" y="0" width="270" height="120" rx="8" fill="#181a22" stroke="#292c37" stroke-width="1"/>
      <text x="24" y="36" fill="#9ca3af" font-family="sans-serif" font-size="15" font-weight="700">TOTAL CAMPAIGN REACH</text>
      <text x="24" y="80" fill="#d4af37" font-family="sans-serif" font-size="38" font-weight="700">2.5M</text>
      <text x="24" y="104" fill="#9ca3af" font-family="sans-serif" font-size="14">From 200k starting base</text>
    </g>

    <g transform="translate(885, 0)">
      <rect x="0" y="0" width="275" height="120" rx="8" fill="#181a22" stroke="#292c37" stroke-width="1"/>
      <text x="24" y="36" fill="#9ca3af" font-family="sans-serif" font-size="15" font-weight="700">SAVE-TO-STREAM RATIO</text>
      <text x="24" y="80" fill="#a855f7" font-family="sans-serif" font-size="38" font-weight="700">14.8%</text>
      <text x="24" y="104" fill="#34d399" font-family="sans-serif" font-size="14">Industry benchmark is ~6%</text>
    </g>
  </g>

  <!-- Growth Trajectory Curve Area Chart -->
  <g transform="translate(60, 245)">
    <rect x="0" y="0" width="1160" height="420" rx="8" fill="#15171d" stroke="#292c36" stroke-width="1.5"/>
    <text x="30" y="42" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">
      WEEKLY AUDIENCE VELOCITY (DISCOVER WEEKLY + RELEASE RADAR)
    </text>

    <!-- Chart Grid Lines -->
    <g transform="translate(30, 70)">
      <line x1="0" y1="50" x2="1100" y2="50" stroke="#242732" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="1090" y="44" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="20">2.5M</text>

      <line x1="0" y1="120" x2="1100" y2="120" stroke="#242732" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="1090" y="114" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="20">1.8M</text>

      <line x1="0" y1="190" x2="1100" y2="190" stroke="#242732" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="1090" y="184" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="20">1.0M</text>

      <line x1="0" y1="260" x2="1100" y2="260" stroke="#242732" stroke-width="1"/>
      <text x="1090" y="254" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="20">200K</text>

      <!-- Curve Path -->
      <path d="M0,250 C250,240 450,210 650,140 C850,105 1000,100 1100,100 L1100,260 L0,260 Z" fill="#1DB954" opacity="0.12"/>
      <path d="M0,250 C250,240 450,210 650,140 C850,105 1000,100 1100,100" fill="none" stroke="url(#spLine)" stroke-width="3"/>

      <!-- Key Milestones Points -->
      <circle cx="0" cy="250" r="5" fill="#1DB954"/>
      <circle cx="650" cy="140" r="6" fill="#ffffff" stroke="#1DB954" stroke-width="3"/>
      <text x="630" y="118" text-anchor="end" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">Release Radar Inflection</text>

      <circle cx="1100" cy="100" r="7" fill="#1DB954"/>
      <text x="1080" y="80" text-anchor="end" fill="#1DB954" font-family="sans-serif" font-size="20" font-weight="700">Peak Week: 2.0M Weekly Streams</text>
    </g>

    <text x="30" y="390" fill="#9ca3af" font-family="sans-serif" font-size="20">
      Methodology: Meta Ad funnels routed to tastemaker playlists triggered Spotify's recommendation algorithm.
    </text>
  </g>
</svg>