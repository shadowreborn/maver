      <circle cx="36" cy="36" r="16" fill="#00A8E1"/>
      <text x="64" y="42" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">Amazon Music</text>
      <text x="20" y="85" fill="#9ca3af" font-family="sans-serif" font-size="12">Delivery: <tspan fill="#34d399">Instant Live</tspan></text>
      <text x="20" y="110" fill="#9ca3af" font-family="sans-serif" font-size="12">Audio: Ultra HD 24-bit Flac</text>
