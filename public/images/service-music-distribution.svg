    <text x="920" y="62" text-anchor="middle" fill="#d4af37" font-family="sans-serif" font-size="22" font-weight="700">200+</text>
    <text x="920" y="85" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="10" font-weight="600">GLOBAL DSPS</text>

