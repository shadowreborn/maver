      <text x="280" y="71" fill="#ffffff" font-family="sans-serif" font-size="17">Week 2: #88</text>
      <text x="540" y="71" fill="#ffffff" font-family="sans-serif" font-size="17">Week 4: #34</text>
      <text x="820" y="71" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">Peak: #14 Top 20 ★</text>
