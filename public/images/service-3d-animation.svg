    <g opacity="0.25">
      <line x1="0" y1="0" x2="0" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="58" y1="0" x2="58" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="116" y1="0" x2="116" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="174" y1="0" x2="174" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="232" y1="0" x2="232" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="290" y1="0" x2="290" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="348" y1="0" x2="348" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="406" y1="0" x2="406" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="464" y1="0" x2="464" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="522" y1="0" x2="522" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="580" y1="0" x2="580" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="638" y1="0" x2="638" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="696" y1="0" x2="696" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="754" y1="0" x2="754" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="812" y1="0" x2="812" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="870" y1="0" x2="870" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="928" y1="0" x2="928" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="986" y1="0" x2="986" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="1044" y1="0" x2="1044" y2="570" stroke="#7c3aed" stroke-width="0.75"/><line x1="1102" y1="0" x2="1102" y2="570" stroke="#7c3aed" stroke-width="0.75"/>
      <line x1="0" y1="0" x2="1160" y2="0" stroke="#7c3aed" stroke-width="0.75"/><line x1="0" y1="57" x2="1160" y2="57" stroke="#7c3aed" stroke-width="0.75"/><line x1="0" y1="114" x2="1160" y2="114" stroke="#7c3aed" stroke-width="0.75"/><line x1="0" y1="171" x2="1160" y2="171" stroke="#7c3aed" stroke-width="0.75"/><line x1="0" y1="228" x2="1160" y2="228" stroke="#7c3aed" stroke-width="0.75"/><line x1="0" y1="285" x2="1160" y2="285" stroke="#7c3aed" stroke-width="0.75"/><line x1="0" y1="342" x2="1160" y2="342" stroke="#7c3aed" stroke-width="0.75"/><line x1="0" y1="399" x2="1160" y2="399" stroke="#7c3aed" stroke-width="0.75"/><line x1="0" y1="456" x2="1160" y2="456" stroke="#7c3aed" stroke-width="0.75"/><line x1="0" y1="513" x2="1160" y2="513" stroke="#7c3aed" stroke-width="0.75"/>
    </g>

    <!-- Center Polygonal Mesh Visualization -->
    <g transform="translate(580, 260)">
      <!-- Wireframe Diamond / Head Structure -->
      <polygon points="0,-160 140,-40 90,140 -90,140 -140,-40" fill="none" stroke="#a855f7" stroke-width="2"/>
      <polygon points="0,-160 80,0 0,140 -80,0" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="-140" y1="-40" x2="140" y2="-40" stroke="#7c3aed" stroke-width="1"/>
      <line x1="-90" y1="140" x2="90" y2="140" stroke="#7c3aed" stroke-width="1"/>
      <line x1="0" y1="-160" x2="0" y2="140" stroke="#d4af37" stroke-width="1.5"/>

      <!-- Rigging Marker Nodes -->
      <circle cx="0" cy="-160" r="4" fill="#d4af37"/>
      <circle cx="140" cy="-40" r="4" fill="#38bdf8"/>
      <circle cx="-140" cy="-40" r="4" fill="#38bdf8"/>
      <circle cx="90" cy="140" r="4" fill="#a855f7"/>
      <circle cx="-90" cy="140" r="4" fill="#a855f7"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>

    <!-- Project Legend Overlay -->
    <g transform="translate(35, 45)">
      <rect x="0" y="0" width="340" height="150" rx="6" fill="#1b1d26" stroke="#2f3342" stroke-width="1"/>
      <text x="20" y="32" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">
        STUDIO CASE STUDY
      </text>
      <text x="20" y="60" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700">
        Kanye West — BLKK SKKKN HEAD
      </text>
      <text x="20" y="85" fill="#9ca3af" font-family="sans-serif" font-size="12">
