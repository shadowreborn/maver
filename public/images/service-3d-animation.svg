      </text>
      <text x="20" y="120" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600">
        Credit: Mimic Productions (Interactive Music Video)
      </text>
    </g>

    <!-- Viewport Coordinates & Polygon Count -->
    <g transform="translate(850, 45)">
      <rect x="0" y="0" width="275" height="120" rx="6" fill="#1b1d26" stroke="#2f3342" stroke-width="1"/>
      <text x="20" y="30" fill="#9ca3af" font-family="monospace" font-size="11">POLY COUNT: 1.84M QUADs</text>
      <text x="20" y="55" fill="#9ca3af" font-family="monospace" font-size="11">FACIAL BLENDSHAPES: 142</text>
      <text x="20" y="80" fill="#9ca3af" font-family="monospace" font-size="11">RENDER ENGINE: UNREAL 5.4</text>
      <text x="20" y="105" fill="#d4af37" font-family="monospace" font-size="11">RAYTRACING: ACTIVE</text>
    </g>
  </g>
</svg>