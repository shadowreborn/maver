<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="meshBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111215"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#meshBg)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1280" height="70" fill="#17181f"/>
  <line x1="0" y1="70" x2="1280" y2="70" stroke="#252733" stroke-width="1"/>
  <text x="60" y="42" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="1">
    2D &amp; 3D ANIMATION — DIGITAL CHARACTER RIGGING &amp; VIRTUAL WORLDS
  </text>
  <rect x="1050" y="18" width="170" height="34" rx="4" fill="#7c3aed"/>
  <text x="1135" y="40" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">
    3D MOTION CAPTURE
  </text>

  <!-- 3D Viewport Workspace -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="1160" height="570" rx="8" fill="#14161d" stroke="#292c38" stroke-width="1.5"/>

