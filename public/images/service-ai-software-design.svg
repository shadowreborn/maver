      </text>

      <!-- Channel 1: Vocals -->
      <g transform="translate(0, 45)">
        <rect x="0" y="0" width="810" height="95" rx="6" fill="#1e212b" stroke="#313543" stroke-width="1"/>
        <text x="20" y="30" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="700">CHANNEL 1: LEAD &amp; HARMONY VOCALS</text>
        <text x="730" y="30" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">ISOLATED</text>
        <rect x="20" y="50" width="770" height="16" rx="3" fill="#ef4444" opacity="0.25"/>
        <rect x="20" y="54" width="400" height="8" rx="2" fill="#ef4444" opacity="0.6"/>
      </g>

      <!-- Channel 2: Drums -->
      <g transform="translate(0, 155)">
        <rect x="0" y="0" width="810" height="95" rx="6" fill="#1e212b" stroke="#313543" stroke-width="1"/>
        <text x="20" y="30" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">CHANNEL 2: DRUMS &amp; TRANSIENTS</text>
        <text x="730" y="30" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">ISOLATED</text>
        <rect x="20" y="50" width="770" height="16" rx="3" fill="#38bdf8" opacity="0.25"/>
        <rect x="20" y="54" width="520" height="8" rx="2" fill="#38bdf8" opacity="0.6"/>
      </g>

      <!-- Channel 3: Bass -->
      <g transform="translate(0, 265)">
        <rect x="0" y="0" width="810" height="95" rx="6" fill="#1e212b" stroke="#313543" stroke-width="1"/>
        <text x="20" y="30" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="700">CHANNEL 3: 808 &amp; SUB BASS</text>
        <text x="730" y="30" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">ISOLATED</text>
        <rect x="20" y="50" width="770" height="16" rx="3" fill="#a855f7" opacity="0.25"/>
        <rect x="20" y="54" width="600" height="8" rx="2" fill="#a855f7" opacity="0.6"/>
      </g>

      <!-- Channel 4: Instruments -->
      <g transform="translate(0, 375)">
        <rect x="0" y="0" width="810" height="95" rx="6" fill="#1e212b" stroke="#313543" stroke-width="1"/>
        <text x="20" y="30" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">CHANNEL 4: SYNTHS, GUITARS &amp; FX</text>
        <text x="730" y="30" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">ISOLATED</text>
        <rect x="20" y="50" width="770" height="16" rx="3" fill="#10b981" opacity="0.25"/>
        <rect x="20" y="54" width="350" height="8" rx="2" fill="#10b981" opacity="0.6"/>
      </g>
