<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#aiBg)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1280" height="70" fill="#17181f"/>
  <line x1="0" y1="70" x2="1280" y2="70" stroke="#262833" stroke-width="1"/>
  <text x="60" y="42" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="1">
    AI MUSIC SOFTWARE &amp; NEURAL AUDIO WORKSPACE
  </text>
  <rect x="1050" y="18" width="170" height="34" rx="4" fill="#6366f1"/>
  <text x="1135" y="40" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">
    NEURAL STEM ENGINE
  </text>

  <!-- Software UI Layout -->
  <g transform="translate(60, 95)">
    <!-- Main Workspace Container -->
    <rect x="0" y="0" width="1160" height="570" rx="8" fill="#16181f" stroke="#292c38" stroke-width="1.5"/>

    <!-- Left Controls Panel -->
    <rect x="0" y="0" width="280" height="570" rx="8" fill="#1b1d25"/>
    <line x1="280" y1="0" x2="280" y2="570" stroke="#292c38" stroke-width="1"/>

    <text x="25" y="40" fill="#6366f1" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">AUDIO ANALYSIS ENGINE</text>
    
    <g transform="translate(25, 60)">
      <text x="0" y="20" fill="#9ca3af" font-family="sans-serif" font-size="11">INPUT FILE:</text>
      <text x="0" y="40" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">master_track_v4.wav</text>

      <text x="0" y="80" fill="#9ca3af" font-family="sans-serif" font-size="11">DETECTED KEY:</text>
      <text x="0" y="100" fill="#d4af37" font-family="sans-serif" font-size="18" font-weight="700">F# Minor (8A)</text>

      <text x="0" y="140" fill="#9ca3af" font-family="sans-serif" font-size="11">DETECTED TEMPO:</text>
      <text x="0" y="160" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="700">124.0 BPM</text>

      <text x="0" y="200" fill="#9ca3af" font-family="sans-serif" font-size="11">AI MOOD CLASSIFICATION:</text>
      <text x="0" y="220" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="600">Dark Cinematic / High Energy</text>

      <text x="0" y="260" fill="#9ca3af" font-family="sans-serif" font-size="11">PROCESSING SPEED:</text>
      <text x="0" y="280" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="700">10× Faster Than Playback</text>
    </g>

    <!-- Right: 4-Stem Visualizer Channels -->
    <g transform="translate(310, 30)">
      <text x="0" y="20" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="700">
